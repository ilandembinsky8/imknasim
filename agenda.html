    <script>

        var x;

    function getParameterByName(name, url) {
			if (!url) url = window.location.href;
			name = name.replace(/[\[\]]/g, '\\$&');
			var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
				results = regex.exec(url);
			if (!results) return null;
			if (!results[2]) return '';
			return decodeURIComponent(results[2].replace(/\+/g, ' '));
		}

function changeColors() {
    if (!x) return; // Guard clause in case x isn't loaded yet

    var bkColor = x.bkcolor;
    var textColor = x.textcolor;
    var sessionColor = x.sessionColor;
    var splitColor = x.splitColor;
    var hoursLeft = x.hoursLeft;
    var forumData = x.textColor2;
    var bkButton = x.bkButton;

    

    document.body.style.backgroundColor = bkColor;
    document.body.style.color = textColor;

    document.querySelectorAll(".split").forEach(element => {
        element.style.background = "linear-gradient(90deg, " + bkColor + " 0%, " + splitColor + " 100%)";
        if (x.roundedcorners=="True") element.style.borderRadius = "10px";
    });

    document.querySelectorAll(".session").forEach(element => {
        element.style.background = "linear-gradient(90deg, " + bkColor + " 0%, " + sessionColor + " 100%)";
        if (x.roundedCorners=="True") element.style.borderRadius = "10px";
    });

    document.querySelectorAll(".itemHour").forEach(element => {
        if (x.hoursframe=="True"){
            element.style.background = "linear-gradient(90deg, " + sessionColor + " 0%, " + hoursLeft + " 100%)";
        }else{
            element.style.background = "transparent";
            element.style.color = x.textcolor;  
        }
    });

    var forumEl = document.querySelector(".forumData");
    if (forumEl) forumEl.style.color = forumData;

    var buttonEl = document.querySelector(".toForm");
    if (buttonEl) buttonEl.style.backgroundColor = bkButton;
}

function getData() {
    xx = getParameterByName("num");
    var url = "server/getconference.asp?item="+xx+"";

    $.ajax({
        url: url,
        type: "GET",
        dataType: "json", // Expects JSON back from the server
        success: function (data2) {
            // Parse only if response is returned as a string
            x = (typeof data2 === "string") ? JSON.parse(data2) : data2;
            console.log(x);
            document.getElementById("forumTitle").innerHTML = x.theName || "";
            document.getElementById("when").innerHTML = x.startdate || "";
            document.getElementById("where").innerHTML = x.location || "";

            var s = "";

            for (let i = 0; i < x.days.length; i++) {
                for (let j = 0; j < x.days[i].splits.length; j++) {
                    for (let k = 0; k < x.days[i].splits[j].sessions.length; k++) {
                        var session = x.days[i].splits[j].sessions[k];

                        if (session.showInAgenda === "True") {
                            s += "<div class='session'>" + session.theName + "</div>";
                        }

                        for (let l = 0; l < session.items.length; l++) {
                            var item = session.items[l];

                            s += "<div class='section1'>";
                            s += "  <div class='itemHour'>" + item.fromHour + "-" + item.toHour + "</div>";
                            s += "  <div class='itemData'>";
                            s += "    <div class='text'>" + item.theName + "</div>";

                           

                            if (item.lecturers && item.lecturers.length > 0) {
                                var lec = item.lecturers[0];
                                s += "    <div class='itemParticipant'>";
                                s += "      <div class='oneItem'>" + lec.theTitle + " " + lec.theName + "</div>";
                                if (lec.theJob!="") s += "      <div class='oneItem'>|</div><div class='oneItem'>" + lec.theJob + "</div>";
                                if (lec.theOrg!="") s += "      <div class='oneItem'>|</div<div class='oneItem'>" + lec.theOrg + "</div>";
                                s += "    </div>";
                            }
                            if (item.theSponsor!=""){
                                s += "    <div class='oneItem'>בחסות חברת "+item.theSponsor+"</div>";
                            }

                            s += "  </div>"; // Close itemData
                            s += "</div>";   // Close section1
                        }
                    }
                }
            }

            document.getElementById("allData").innerHTML = s;
            s1 = "";
            for (i=0;i<x.sponsors.length;i++){
                s1 = s1 + "<div class='oneItem'><img src='images\\"+x.sponsors[i].theImage+"'></div>"
            }
            document.getElementById("sponsors").innerHTML = s1;
            setTimeout(changeColors, 1000);
        },
        error: function (xhr, ajaxOptions, thrownError) {
            console.error("Failed to fetch data:", thrownError);
        }
    });
}
    </script>
