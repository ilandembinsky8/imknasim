<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/stylesheet.css">
    <title>IMKNASIM - טפסים</title>
    <script>
        $(document).ready(function(){
            $(document).on("click", ".arrowImage", function(){
                x1 = this.id;
                y = x1.substring(1);
                $("#d"+y+"").slideToggle();
                z = document.getElementById(x1).src;
                w = z.indexOf("arrowUp");
                if (w>0)
                    document.getElementById(x1).src = "cut/arrowDown.png";
                else
                    document.getElementById(x1).src = "cut/arrowUp.png";
            })
        });
    </script>
</head>
<body onload="getData()">
    <div class="banner">

    </div>
    <div class="underBanner">
        <div class="link">
            <a id="toAgenda" href="agenda.html">
               <div class="button">לצפייה בתכנית הכנס</div>
            </a>
        </div>
        <div class="clientLogo"><img id="clientLogo" src="cut/clientLogo.png" onerror="this.onerror=null;this.src='cut/clientLogo.png'"></div>
    </div>
    <div class="section1">
        <div class="inner1">
            <div class="editPanel">
                <div class="editToggle" onclick="toggleEdit()">עריכה לאחר הרשמה</div>
                <div id="editBody" class="editBody" style="display:none">
                    <div id="editMsg" class="editMsg"></div>
                    <div class="editField"><input type="text" id="editCell" placeholder="טלפון נייד"></div>
                    <div class="editField"><input type="text" id="editCode" placeholder="קוד בן 4 ספרות" maxlength="4"></div>
                    <div class="editButton" onclick="loadRegistration()">טעינת הפרטים</div>
                </div>
            </div>
            <div id="forumTitle" class="forumTitle">
                &nbsp;
            </div>
            <div class="forumDetails">
                <div id="when" class="oneItem">&nbsp;</div>
                <div class="oneItem">|</div>
                <div id="where" class="oneItem">&nbsp;</div>
            </div>
            <div id="allData" style="float:right;width:100%">

            </div>
            <div class="sendButton" onclick="validateForm()">שליחה</div>
            <div id="sendError" class="sendError"></div>
        </div>
        <div class="emptySpace"></div>
    </div>
    <div class="footer2">
        <div class="inner">
            <div class="oneSection">
                <div class="r100">מגדל השחר, אריאל שרון 4 גבעתיים, ישראל</div>
                <div class="r100">03-6081520</div>
                <div class="r100">03-6081520</div>
                <div class="r100">office@imknasim.co.il</div>
                <div class="r100">www.imknasim.co.il</div>
            </div>
            <div class="oneSection">
                <div class="r100">
                    <div class="social"><img src="cut/facebook.png" style="width:100%"></div>
                    <div class="social"><img src="cut/whatsapp.png" style="width:100%"></div>
                    <div class="social"><img src="cut/instegram.png" style="width:100%"></div>
                </div>
                <div class="links">
                    <div class="oneItem">הצהרת נגישות</div>
                    <div class="oneItem">מדיניות פרטיות</div>
                </div>
            </div>
            <div class="leftLogo"><img src="cut/selfLogoForms.png"></div>
        </div>
    </div>
    <script>

        var x;

    // set once the registrant has signed in with mobile + code, so the next
    // submit updates that registration instead of creating a new one
    var editReg = "";
    var editCode = "";
    // the phone or email that got past the closed list screen. it travels
    // with the registration, because saveForm cannot trust the form fields
    // for this - the registrant is free to edit them
    var gateWho = "";

    // the mobile field is the identity key. field 9 (landline) is never used
    var CELL_FIELD = "11";
    var EMAIL_FIELD = "8";
    var FIRST_FIELD = "1";
    var LAST_FIELD = "2";
    // participant type drives the registration price, which is shown read only
    var PARTICIPANT_FIELD = "25";
    var PRICE_FIELD = "32";
    // the lodging section feeds that same price field - one figure covers
    // the conference and the stay together
    var LODGING_FIELD = "38";      // is lodging needed at all
    var CHECKIN_FIELD = "39";
    var CHECKOUT_FIELD = "40";
    var NIGHTS_FIELD = "41";       // derived from the two dates
    var ROOM_FIELD = "42";         // confhotel, carries the nightly rates
    var PARTNER_FIELD = "43";      // sharing the room
    var BREAKFAST_FIELD = "44";
    // a free text companion answer is stored as this offset plus the field id
    var OTHER_OFFSET = 10000;

    function getParameterByName(name, url) {
			if (!url) url = window.location.href;
			name = name.replace(/[\[\]]/g, '\\$&');
			var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
				results = regex.exec(url);
			if (!results) return null;
			if (!results[2]) return '';
			return decodeURIComponent(results[2].replace(/\+/g, ' '));
		}

function getData() {
    xx = getParameterByName("num");
    var url = "server/getForm.asp?item="+xx+"";

    $.ajax({
        url: url,
        type: "GET",
        dataType: "json",
        success: function (data2) {
            x = (typeof data2 === "string") ? JSON.parse(data2) : data2;
            console.log(x);
            if (!x || !x.theNumber) return;

            document.getElementById("forumTitle").innerHTML = x.theName || "";
            document.getElementById("when").innerHTML = (x.startdate || "") + (x.enddate && x.enddate != x.startdate ? " - " + x.enddate : "");
            document.getElementById("where").innerHTML = x.location || "";
            document.getElementById("toAgenda").href = "agenda.html?num=" + x.theNumber;
            if (x.banner) document.getElementById("banner").src = "images/" + x.banner;
            showLogo(x.logo);

            if (x.closeForm === "True") {
                showClosed();
                setTimeout(changeColors, 1000);
                return;
            }

            // a conference on a closed list arrives with no sections at all
            // until the visitor identifies themselves. the edit panel is left
            // alone, so somebody already registered can still get in
            if (x.isClosedList === "True" && (!x.sections || x.sections.length === 0)) {
                showGate();
                applyEditAvailability();
                setTimeout(changeColors, 1000);
                return;
            }

            buildForm(x);
            applyEditAvailability();
            if (x.editOpen === "True" && getParameterByName("edit") === "1") openEdit();
            setTimeout(changeColors, 1000);
        },
        error: function (xhr, ajaxOptions, thrownError) {
            console.error("Failed to fetch form:", thrownError);
        }
    });
}

function buildForm(x) {
    var s = "";
    var secNum = 0;

    for (var i = 0; i < x.sections.length; i++) {
        var sec = x.sections[i];
        secNum++;

        s += "<div class='formArea'>";
        s += "  <div class='title'>";
        s += "    <div class='text'>" + sec.theName + "</div>";
        s += "    <div class='arrow'><img class='arrowImage' id='i" + secNum + "' src='cut/arrowUp.png'></div>";
        s += "  </div>";
        s += "  <div id='d" + secNum + "' class='data'>";

        var row = "";
        var inRow = 0;

        for (var k = 0; k < sec.fields.length; k++) {
            var f = sec.fields[k];

            // a link with no address is not shown at all - "click here"
            // leading nowhere is worse than nothing
            if (f.fieldType == "9" && !f.theLink) continue;

            var multi = (f.fieldType == "3" || f.fieldType == "8");
            // a consent carries a sentence, and a link is a line of its own,
            // so neither sits in the four-to-a-row grid
            var ownRow = multi || f.fieldType == "9" || (f.fieldType == "4" && f.theText);

            if (ownRow) {
                if (inRow > 0) { s += "<div class='oneSection'>" + row + "</div>"; row = ""; inRow = 0; }
                s += "<div class='oneSection'>" + (multi ? buildMultiField(f) : buildSmallField(f)) + "</div>";
            } else {
                row += buildSmallField(f);
                inRow++;
                if (inRow == 4) { s += "<div class='oneSection'>" + row + "</div>"; row = ""; inRow = 0; }
            }
        }
        if (inRow > 0) s += "<div class='oneSection'>" + row + "</div>";

        s += "  </div>";
        s += "</div>";
    }

    document.getElementById("allData").innerHTML = s;

    // a choice offering "אחר" reveals a free text field beside it
    $("[data-other-for]").each(function () {
        var txt = this;
        var owner = document.querySelector("[data-field='" + txt.getAttribute("data-other-for") + "']");
        // addEventListener rather than onchange: the price handlers below
        // watch some of the same controls, and one assignment would replace
        // the other
        if (owner) owner.addEventListener("change", function () { toggleOther(txt); });
        toggleOther(txt);
    });

    // every control that can move the conference price or the lodging price
    // recomputes the single figure shown in the payment section
    var drivers = [PARTICIPANT_FIELD, CHECKIN_FIELD, CHECKOUT_FIELD, ROOM_FIELD];
    for (var d = 0; d < drivers.length; d++) {
        var driver = document.querySelector("[data-field='" + drivers[d] + "']");
        if (driver) driver.addEventListener("change", applyPrice);
    }
    applyPrice();

    // warn about a duplicate as soon as the registrant leaves the mobile field
    var cell = document.querySelector("[data-field='" + CELL_FIELD + "']");
    if (cell) cell.onblur = function () { checkDuplicate(this); };
}

// ask the server whether this mobile is already registered for this conference
function checkDuplicate(el) {
    if (editReg !== "") return;                    // already editing that registration
    var val = (el.value || "").replace(/^\s+|\s+$/g, "");
    clearDupMsg();
    if (val === "") return;

    $.ajax({
        url: "server/checkCell.asp",
        type: "GET",
        data: { item: x.theNumber, cell: val },
        dataType: "json",
        success: function (res) {
            var o = (typeof res === "string") ? JSON.parse(res) : res;
            if (o && o.exists === "True") {
                var box = el.closest(".smallField, .bigField");
                if (box) {
                    var m = document.createElement("div");
                    m.className = "dupMsg";
                    m.innerHTML = (x.editOpen === "True")
                        ? "המספר הזה כבר רשום לכנס. אפשר להזין אותו יחד עם הקוד שקיבלתם כדי לערוך את הפרטים."
                        : "המספר הזה כבר רשום לכנס.";
                    box.appendChild(m);
                }
                if (x.editOpen === "True") {
                    document.getElementById("editCell").value = val;
                    openEdit();
                }
            }
        }
    });
}

function clearDupMsg() {
    $(".dupMsg").remove();
}

// editOpen folds both conditions together: the conference allows editing
// (conference.isedit) and the deadline (conference.whentoclose) has not passed
function applyEditAvailability() {
    var panel = document.querySelector(".editPanel");
    if (panel) panel.style.display = (x.editOpen === "True") ? "block" : "none";
}

function openEdit() {
    document.getElementById("editBody").style.display = "block";
}

function toggleEdit() {
    var el = document.getElementById("editBody");
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

// sign in to an existing registration and prefill the form with its answers
function loadRegistration() {
    var cell = (document.getElementById("editCell").value || "").replace(/^\s+|\s+$/g, "");
    var code = (document.getElementById("editCode").value || "").replace(/^\s+|\s+$/g, "");
    var msg = document.getElementById("editMsg");
    msg.innerHTML = "";

    if (cell === "" || code === "") {
        msg.innerHTML = "יש להזין טלפון נייד וקוד.";
        return;
    }

    $.ajax({
        url: "server/getReg.asp",
        type: "GET",
        data: { item: x.theNumber, cell: cell, code: code },
        dataType: "json",
        success: function (res) {
            var o = (typeof res === "string") ? JSON.parse(res) : res;
            if (o && o.ok === "True") {
                editReg = o.theNumber;
                editCode = code;
                // on a closed list conference the form was never sent, so it
                // has to be fetched now, with the code as the proof
                if (!document.querySelector("[data-field]")) {
                    $.ajax({
                        url: "server/getForm.asp",
                        type: "GET",
                        data: { item: x.theNumber, reg: o.theNumber, code: code },
                        dataType: "json",
                        async: false,
                        success: function (d3) {
                            var full = (typeof d3 === "string") ? JSON.parse(d3) : d3;
                            if (full && full.sections && full.sections.length > 0) x = full;
                        }
                    });
                    ensureFormBuilt();
                    setTimeout(changeColors, 1000);
                }
                prefill(o.values);
                clearDupMsg();
                document.getElementById("editBody").style.display = "none";
                document.querySelector(".editToggle").innerHTML =
                    "עריכת הרשמה מספר " + o.theNumber;
                document.querySelector(".sendButton").innerHTML = "עדכון";
                window.scrollTo({ top: 0, behavior: "smooth" });
            } else if (o && o.error === "closed") {
                msg.innerHTML = "לא ניתן עוד לערוך את הפרטים לכנס זה.";
            } else if (o && o.error === "locked") {
                msg.innerHTML = "בוצעו יותר מדי ניסיונות. אפשר לנסות שוב אחרי " + o.until + ".";
            } else {
                msg.innerHTML = "הטלפון או הקוד אינם נכונים.";
            }
        },
        error: function () {
            msg.innerHTML = "אירעה תקלה. אנא נסו שוב.";
        }
    });
}

function prefill(values) {
    if (!values) return;
    var i;
    // the owning choices first, so their companions are revealed before
    // anything tries to write into them
    for (i = 0; i < values.length; i++) {
        if (parseInt(values[i].theField, 10) < OTHER_OFFSET) {
            setFieldValue(values[i].theField, values[i].theValue);
        }
    }
    refreshOtherFields();
    applyPrice();
    for (i = 0; i < values.length; i++) {
        if (parseInt(values[i].theField, 10) >= OTHER_OFFSET) {
            setFieldValue(values[i].theField, values[i].theValue);
        }
    }
}

function setFieldValue(id, val) {
    var el = document.querySelector("[data-field='" + id + "']");
    if (!el) return;
    var t = el.getAttribute("data-type");

    if (t == "3" || t == "8") {
        var picked = String(val).split(",");
        $(el).find("input[type=checkbox]").each(function () {
            this.checked = (picked.indexOf(this.value) >= 0);
        });
    } else if (t == "4") {
        setYesNo(el, val === "True");
    } else {
        el.value = val;
    }
}

function fieldLabel(f) {
    return f.theName + (f.isMandatory == "True" ? " *" : "");
}

// the free text box that sits beside a field and only matters while that
// field holds one particular answer: "אחר" on a choice, or yes on the
// roommate question. it posts and is stored as 10000 + the owner's field id
function otherBox(f) {
    if (!f.otherOption || f.otherOption === "0") return "";
    var hint = (f.theNumber === PARTNER_FIELD) ? "שם השותף לחדר" : (f.theName + " - פירוט");
    return "<input type='text' class='otherText' maxlength='255'"
         + " placeholder='" + hint + "'"
         + " data-field='" + (OTHER_OFFSET + parseInt(f.theNumber, 10)) + "'"
         + " data-type='1' data-valid='0' data-mand='False'"
         + " data-other-for='" + f.theNumber + "'"
         + " data-other-value='" + f.otherOption + "'"
         + " style='display:none'>";
}

function fieldAttrs(f) {
    return "data-field='" + f.theNumber + "' data-type='" + f.fieldType +
           "' data-valid='" + f.validation + "' data-mand='" + f.isMandatory + "'";
}

// three fields are not the registrant's to type: the price and the night
// count are derived, and on a closed list the phone is the one the
// invitation was issued to. saveForm enforces that last one for real
function readOnlyAttr(f) {
    if (f.theNumber === PRICE_FIELD || f.theNumber === NIGHTS_FIELD) return " readonly";
    if (f.theNumber === CELL_FIELD && x.invitee && x.invitee.theCell) return " readonly";
    return "";
}

function sizeAttr(f) {
    var n = parseInt(f.theSize, 10);
    return (n > 0) ? " maxlength='" + n + "'" : "";
}

function buildSmallField(f) {
    var lbl = fieldLabel(f);
    var at = fieldAttrs(f);
    var wrap = "smallField";
    if (f.fieldType == "9") wrap = "linkField";
    else if (f.fieldType == "4" && f.theText) wrap = "consentField";
    var h = "<div class='" + wrap + "'>";

    if (f.fieldType == "2" || f.fieldType == "7") {
        h += "<select " + at + "><option value='0'>" + lbl + "</option>";
        for (var i = 0; i < f.options.length; i++)
            h += "<option value='" + f.options[i].theNumber + "'>" + f.options[i].theName + "</option>";
        h += "</select>";
        h += otherBox(f);
    } else if (f.fieldType == "9") {
        // nothing to answer here, only something to read. it carries no
        // data-field, so submitForm never picks it up and nothing is stored
        h += "<a class='docLink' href='" + f.theLink + "' target='_blank' rel='noopener'>" +
             (f.theText ? f.theText : f.theName) + "</a>";
    } else if (f.fieldType == "4") {
        if (f.theText) {
            // the wording comes from the admin as html, asterisk and all
            h += "<div class='consentText'>" + f.theText +
                 (f.isMandatory == "True" ? " <span class='consentStar'>*</span>" : "") + "</div>";
        } else {
            h += "<div class='radioLabel'>" + lbl + "</div>";
        }
        h += "<div class='radioArea2' " + at +
             (f.isConsent === "True" ? " data-consent='True'" : "") + " data-value='False'>";
        h += "  <div class='radioRight' onclick=\"pickYesNo(this)\">כן</div>";
        h += "  <div class='radioLeftSelected' onclick=\"pickYesNo(this)\">לא</div>";
        h += "</div>";
        h += otherBox(f);
    } else if (f.fieldType == "5") {
        h += "<div class='radioLabel'>" + lbl + "</div>";
        h += "<input type='date' " + at + ">";
    } else if (f.fieldType == "6") {
        // a derived field is filled in for the registrant, and a placeholder
        // is gone the moment the box holds a value - so it gets a real label
        if (readOnlyAttr(f) !== "") h += "<div class='radioLabel'>" + lbl + "</div>";
        h += "<input type='text' inputmode='numeric' placeholder='" + lbl + "' " + at + sizeAttr(f) + readOnlyAttr(f) + ">";
    } else {
        // same reason as the derived number fields: a placeholder is gone
        // the moment the box holds a value, so a filled read only field
        // would sit there unlabelled
        if (readOnlyAttr(f) !== "") h += "<div class='radioLabel'>" + lbl + "</div>";
        h += "<input type='text' placeholder='" + lbl + "' " + at + sizeAttr(f) + readOnlyAttr(f) + ">";
    }

    h += "<div class='fieldError'></div>";
    h += "</div>";
    return h;
}

function buildMultiField(f) {
    var h = "<div class='bigField'>";
    h += "<div class='radioLabel'>" + fieldLabel(f) + "</div>";
    h += "<div class='checkList' " + fieldAttrs(f) + ">";
    for (var i = 0; i < f.options.length; i++) {
        h += "<div class='checkItem'><label><input type='checkbox' value='" +
             f.options[i].theNumber + "'> " + f.options[i].theName + "</label></div>";
    }
    h += "</div>";
    h += otherBox(f);
    h += "<div class='fieldError'></div>";
    h += "</div>";
    return h;
}

// the single place that paints a yes/no control and records its answer
function setYesNo(area, isYes) {
    area.children[0].className = isYes ? "radioRightSelected" : "radioRight";
    area.children[1].className = isYes ? "radioLeft" : "radioLeftSelected";
    area.setAttribute("data-value", isYes ? "True" : "False");
}

function pickYesNo(el) {
    var area = el.parentNode;
    setYesNo(area, el === area.children[0]);
    // lodging, sharing and breakfast are all yes/no and all three move the
    // price. these are divs, so they never fire a change event of their own
    applyPrice();
}

function showLogo(logo) {
    var el = document.getElementById("clientLogo");
    if (!el) return;
    if (!logo) { el.style.display = "none"; return; }
    // a missing file is still "no logo" - show nothing rather than a stand-in
    el.onerror = function () { this.onerror = null; this.style.display = "none"; };
    el.src = "images/" + logo;
}

// the closed list screen. the form is not in the page at this point - the
// server never sent it - so this is the whole of what the visitor can see
function showGate() {
    var s = "";
    s += "<div class='formArea'><div class='data'>";
    s += "  <div class='gateBox'>";
    s += "    <div class='gateTitle'>ההרשמה לכנס זה פתוחה למוזמנים בלבד</div>";
    s += "    <div class='gateHint'>יש להזין את הטלפון הנייד או הדואר האלקטרוני שאיתם הוזמנתם</div>";
    s += "    <div class='gateRow'>";
    s += "      <input type='text' id='gateWho' placeholder='טלפון נייד או מייל'>";
    s += "      <div class='gateButton' onclick='enterGate()'>כניסה</div>";
    s += "    </div>";
    s += "    <div id='gateMsg' class='gateMsg'></div>";
    s += "  </div>";
    s += "</div></div>";
    document.getElementById("allData").innerHTML = s;
    var send = document.querySelector(".sendButton");
    if (send) send.style.display = "none";
}

// ask the server again, this time with the contact. the form comes back only
// if that contact is on the list
function enterGate() {
    var who = (document.getElementById("gateWho").value || "").replace(/^\s+|\s+$/g, "");
    var msg = document.getElementById("gateMsg");
    msg.innerHTML = "";
    if (who === "") {
        msg.innerHTML = "יש להזין טלפון נייד או דואר אלקטרוני.";
        return;
    }

    $.ajax({
        url: "server/getForm.asp",
        type: "GET",
        data: { item: x.theNumber, gate: who },
        dataType: "json",
        success: function (data2) {
            var o = (typeof data2 === "string") ? JSON.parse(data2) : data2;
            if (!o || !o.sections || o.sections.length === 0) {
                if (o && o.gateUsed === "True") {
                    msg.innerHTML = "כבר בוצעה הרשמה עם הפרטים האלה. לשינוי הפרטים יש להשתמש בקישור העריכה שלמעלה.";
                } else {
                    // deliberately says nothing about who is on the list
                    msg.innerHTML = "הפרטים שהוזנו אינם מופיעים ברשימת המוזמנים לכנס זה.";
                }
                return;
            }
            x = o;
            gateWho = who;
            buildForm(x);
            var send = document.querySelector(".sendButton");
            if (send) send.style.display = "";
            fillFromInvitee(o.invitee);
            setTimeout(changeColors, 1000);
        },
        error: function () {
            msg.innerHTML = "אירעה תקלה. אנא נסו שוב.";
        }
    });
}

// start the form off with what the list already knows. all of it stays
// editable - the list decides who may register, not what they must answer
function fillFromInvitee(who) {
    if (!who) return;
    var full = (who.theName || "").replace(/^\s+|\s+$/g, "");
    if (full !== "") {
        var cut = full.indexOf(" ");
        if (cut < 0) {
            setFieldValue(FIRST_FIELD, full);
        } else {
            setFieldValue(FIRST_FIELD, full.substring(0, cut));
            setFieldValue(LAST_FIELD, full.substring(cut + 1).replace(/^\s+/, ""));
        }
    }
    if (who.theEmail) setFieldValue(EMAIL_FIELD, who.theEmail);
    if (who.theCell) setFieldValue(CELL_FIELD, who.theCell);
}

// the form is only in the page once somebody is allowed to see it, so both
// ways in have to make sure it is there before writing answers into it
function ensureFormBuilt() {
    if (document.querySelector("[data-field]")) return;
    buildForm(x);
    var send = document.querySelector(".sendButton");
    if (send) send.style.display = "";
}

function showClosed() {
    var dark = "color:rgba(79,79,79,1)";
    var s = "";
    s += "<div class='forumTitle'>" + (x.theName || "") + "</div>";
    s += "<div class='forumDetails'>";
    s += "  <div class='oneItem'>" + (x.startdate || "") + "</div>";
    s += "  <div class='oneItem'>|</div>";
    s += "  <div class='oneItem'>" + (x.location || "") + "</div>";
    s += "</div>";
    s += "<div class='formArea'><div class='data' style='text-align:center'>";
    s += "<div style='font-size:1.8rem;" + dark + "'>ההרשמה לכנס סגורה</div>";
    s += "</div></div>";
    document.querySelector(".inner1").innerHTML = s;
}

// the companion is only shown, and only required, while "אחר" is chosen
function toggleOther(txt) {
    var owner = document.querySelector("[data-field='" + txt.getAttribute("data-other-for") + "']");
    var trigger = txt.getAttribute("data-other-value");
    var show = false;
    if (owner) {
        if (owner.hasAttribute("data-value")) {
            // a yes/no field keeps its answer in data-value
            show = owner.getAttribute("data-value") === trigger;
        } else if (owner.tagName === "DIV") {
            // a multi choice field is a group of checkboxes, so the question is
            // whether the one carrying the trigger is ticked. a checkbox fires
            // change that bubbles to this div, so the existing listener catches it
            var box = owner.querySelector("input[type=checkbox][value='" + trigger + "']");
            show = !!box && box.checked;
        } else {
            show = owner.value === trigger;
        }
    }
    txt.style.display = show ? "block" : "none";
    if (!show) txt.value = "";
}

function refreshOtherFields() {
    $("[data-other-for]").each(function () { toggleOther(this); });
}

function fieldEl(id) {
    return document.querySelector("[data-field='" + id + "']");
}

// the field as getForm described it, for what the DOM does not carry
function fieldMeta(id) {
    if (!x.sections) return null;
    for (var s = 0; s < x.sections.length; s++) {
        var list = x.sections[s].fields;
        for (var i = 0; i < list.length; i++) {
            if (list[i].theNumber === id) return list[i];
        }
    }
    return null;
}

function toNum(v) {
    var parsed = parseInt(v, 10);
    return isNaN(parsed) ? 0 : parsed;
}

// a yes/no field is a div that keeps its answer in data-value
function yesNo(id) {
    var el = fieldEl(id);
    return !!el && el.getAttribute("data-value") === "True";
}

// an <input type="date"> always reads back as yyyy-mm-dd, whatever the browser
// chooses to show the registrant
function readDate(id) {
    var el = fieldEl(id);
    if (!el || !el.value) return null;
    var parts = el.value.split("-");
    if (parts.length !== 3) return null;
    return Date.UTC(toNum(parts[0]), toNum(parts[1]) - 1, toNum(parts[2]));
}

// the stay is checkout minus checkin. the night count is read only, so this is
// the only thing that ever writes it
function computeNights() {
    var nightsEl = fieldEl(NIGHTS_FIELD);
    var from = readDate(CHECKIN_FIELD);
    var to = readDate(CHECKOUT_FIELD);
    var nights = 0;
    if (from !== null && to !== null) {
        nights = Math.round((to - from) / 86400000);
        if (nights < 0) nights = 0;
    }
    if (nightsEl) nightsEl.value = (nights > 0) ? nights : "";
    return nights;
}

// confprice holds one price per participant type for this conference
function conferencePrice() {
    var ptEl = fieldEl(PARTICIPANT_FIELD);
    if (!ptEl || !x.prices) return 0;
    var chosen = ptEl.value;
    if (chosen === "" || chosen === "0") return 0;
    // what an "other" participant type should cost has not been decided, so it
    // is left out of the total rather than guessed at
    var companion = document.querySelector("[data-other-for='" + PARTICIPANT_FIELD + "']");
    if (companion && companion.getAttribute("data-other-value") === chosen) return 0;
    for (var i = 0; i < x.prices.length; i++) {
        if (x.prices[i].theParticipant === chosen) return toNum(x.prices[i].thePrice);
    }
    return 0;
}

// every confhotel figure is per night: the room, the room when it is shared,
// and the breakfast supplement
// the confhotel row behind the current room selection, or null
function chosenRoom() {
    var roomEl = fieldEl(ROOM_FIELD);
    if (!roomEl || roomEl.value === "" || roomEl.value === "0") return null;
    var meta = fieldMeta(ROOM_FIELD);
    if (!meta || !meta.options) return null;
    for (var i = 0; i < meta.options.length; i++) {
        if (meta.options[i].theNumber === roomEl.value) return meta.options[i];
    }
    return null;
}

// sharing a room does not change what either occupant pays - each one pays
// the rate of the row they chose. withPartner only says the room may be
// shared at all, which is what syncPartnerField below reads
function lodgingPrice(nights) {
    if (nights <= 0) return 0;
    if (!yesNo(LODGING_FIELD)) return 0;
    var room = chosenRoom();
    if (!room) return 0;
    var nightly = toNum(room.thePrice);
    if (yesNo(BREAKFAST_FIELD)) nightly = nightly + toNum(room.breakfast);
    return nights * nightly;
}

// the roommate question is only asked for a room the client marked shareable.
// saveForm applies the same rule, so a direct post cannot get around it
function syncPartnerField() {
    var el = fieldEl(PARTNER_FIELD);
    if (!el) return;
    var room = chosenRoom();
    var ok = yesNo(LODGING_FIELD) && !!room && room.withPartner === "True";
    if (!ok && el.getAttribute("data-value") === "True") setYesNo(el, false);
    var wrap = el.closest(".smallField, .bigField");
    if (wrap) wrap.style.display = ok ? "" : "none";
}

// one figure for the conference and the stay together
function applyPrice() {
    if (typeof x === "undefined" || !x || !x.sections) return;
    syncPartnerField();
    refreshOtherFields();
    var nights = computeNights();
    var priceEl = fieldEl(PRICE_FIELD);
    if (!priceEl) return;
    var total = conferencePrice() + lodgingPrice(nights);
    priceEl.value = (total > 0) ? total : "";
}

function validateForm() {
    var firstBad = null;

    $(".fieldError").html("");
    $(".errorField").removeClass("errorField");

    $("[data-field]").each(function () {
        var el = this;
        // a companion that is not on screen carries no answer to check
        if (el.hasAttribute("data-other-for") && el.style.display === "none") return;
        var t = el.getAttribute("data-type");
        var mand = (el.getAttribute("data-mand") == "True");
        if (el.hasAttribute("data-other-for")) mand = true;
        var v = parseInt(el.getAttribute("data-valid") || "0", 10);
        var val = "";
        var msg = "";

        if (t == "3" || t == "8") {
            val = $(el).find("input:checked").length > 0 ? "x" : "";
        } else if (t == "4") {
            // a yes/no control always holds a value, so "answered" is never the
            // question. for a consent the question is whether it was agreed to
            val = (el.getAttribute("data-consent") === "True")
                ? (el.getAttribute("data-value") === "True" ? "x" : "")
                : "x";
        } else {
            val = (el.value || "").replace(/^\s+|\s+$/g, "");
            if ((t == "2" || t == "7") && val == "0") val = "";
        }

        if (mand && val === "") {
            msg = (t == "4" && el.getAttribute("data-consent") === "True")
                ? "יש לאשר כדי להמשיך"
                : "שדה חובה";
        } else if (val !== "" && t != "3" && t != "8" && t != "4") {
            msg = checkValidation(v, val);
        }

        if (msg !== "") {
            $(el).addClass("errorField");
            $(el).closest(".smallField, .bigField, .consentField").find(".fieldError").html(msg);
            if (firstBad === null) firstBad = el;
        }
    });

    if (firstBad !== null) {
        firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
        return false;
    }

    submitForm();
    return true;
}

// collect every control into f<fieldId> pairs and post them to the server
function submitForm() {
    var data = { item: x.theNumber };
    if (editReg !== "") {
        data.reg = editReg;
        data.code = editCode;
    }
    if (gateWho !== "") data.gate = gateWho;

    $("[data-field]").each(function () {
        var el = this;
        var id = el.getAttribute("data-field");
        var t = el.getAttribute("data-type");

        if (t == "3" || t == "8") {
            var picked = [];
            $(el).find("input:checked").each(function () { picked.push(this.value); });
            data["f" + id] = picked.join(",");
        } else if (t == "4") {
            data["f" + id] = el.getAttribute("data-value");
        } else {
            data["f" + id] = (el.value || "").replace(/^\s+|\s+$/g, "");
        }
    });

    setSending(true);
    document.getElementById("sendError").innerHTML = "";

    $.ajax({
        url: "server/saveForm.asp",
        type: "POST",
        data: data,
        dataType: "json",
        success: function (res) {
            var o = (typeof res === "string") ? JSON.parse(res) : res;
            if (o && o.ok === "True") {
                showThanks(o);
            } else {
                setSending(false);
                if (o && o.error === "duplicate") {
                    document.getElementById("sendError").innerHTML =
                        "מספר הטלפון כבר רשום לכנס. אפשר לערוך את ההרשמה הקיימת עם הקוד שקיבלתם.";
                    openEdit();
                } else if (o && o.error === "formclosed") {
                    document.getElementById("sendError").innerHTML = "ההרשמה לכנס סגורה.";
                } else if (o && o.error === "nostock") {
                    document.getElementById("sendError").innerHTML = "החדר שנבחר אזל. אנא בחרו אפשרות אחרת.";
                } else if (o && o.error === "closed") {
                    document.getElementById("sendError").innerHTML = "לא ניתן עוד לערוך את הפרטים לכנס זה.";
                } else if (o && o.error === "badcode") {
                    document.getElementById("sendError").innerHTML = "הקוד אינו נכון. יש להתחבר מחדש כדי לערוך.";
                } else if (o && o.error === "notonlist") {
                    document.getElementById("sendError").innerHTML = "ההזמנה אינה תקפה יותר, או שכבר נעשה בה שימוש. יש לרענן את העמוד ולהזדהות מחדש.";
                } else {
                    document.getElementById("sendError").innerHTML = "השליחה נכשלה. אנא נסו שוב.";
                }
                console.error("save failed:", o);
            }
        },
        error: function (xhr, ajaxOptions, thrownError) {
            setSending(false);
            document.getElementById("sendError").innerHTML = "השליחה נכשלה. אנא נסו שוב.";
            console.error("save failed:", thrownError);
        }
    });
}

// lock the button while the request is in flight so one click is one registration
function setSending(on) {
    var btn = document.querySelector(".sendButton");
    if (!btn) return;
    btn.style.pointerEvents = on ? "none" : "auto";
    btn.style.opacity = on ? "0.6" : "1";
    btn.innerHTML = on ? "שולח..." : "שליחה";
}

function showThanks(o) {
    var dark = "color:rgba(79,79,79,1)";
    var s = "";
    s += "<div class='forumTitle'>" + (x.theName || "") + "</div>";
    s += "<div class='formArea'>";
    s += "  <div class='data' style='text-align:center'>";

    if (o.mode === "edit") {
        s += "<div style='font-size:1.8rem;" + dark + ";margin-bottom:12px'>הפרטים עודכנו בהצלחה</div>";
        s += "<div style='font-size:1.3rem;" + dark + "'>מספר הרשמה: " + o.theNumber + "</div>";
    } else {
        s += "<div style='font-size:1.8rem;" + dark + ";margin-bottom:12px'>ההרשמה נקלטה בהצלחה</div>";
        s += "<div style='font-size:1.3rem;" + dark + ";margin-bottom:18px'>מספר הרשמה: " + o.theNumber + "</div>";
        if (o.theCode) {
            s += "<div style='font-size:2.2rem;font-family:Assistant-Bold;" + dark + "'>" + o.theCode + "</div>";
            s += "<div style='font-size:1.1rem;" + dark + ";margin-top:8px'>";
            s += "זהו הקוד שלכם. שמרו אותו — הוא נדרש יחד עם מספר הטלפון הנייד כדי לערוך את הפרטים";
            if (o.editUntil) s += ", עד לתאריך " + o.editUntil;
            s += ".</div>";
        }
    }

    s += "  </div>";
    s += "</div>";

    // the form itself is gone from the page now, so the link reloads it and
    // reopens the panel instead of trying to prefill controls that do not exist
    if (x.editOpen === "True") {
        s += "<div class='editPanel'>";
        s += "  <div class='editToggle' onclick=\"reopenForEdit()\">עריכה לאחר הרשמה</div>";
        s += "</div>";
    }

    document.querySelector(".inner1").innerHTML = s;
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function reopenForEdit() {
    // a real query change, so the browser performs a full navigation and the
    // form is rebuilt. a hash alone would not reload the page
    location.href = "forms.html?num=" + x.theNumber + "&edit=1";
}

function checkValidation(v, val) {
    switch (v) {
        case 2:
            return /^\d+$/.test(val) ? "" : "ספרות בלבד";
        case 3:
            return validIsraeliId(val) ? "" : "תעודת זהות לא תקינה";
        case 4:
            return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val) ? "" : "כתובת דואר אלקטרוני לא תקינה";
        case 5:
            return isNaN(Date.parse(val)) ? "תאריך לא תקין" : "";
        case 6:
            // an optional + or 00 prefix, then 7 to 15 digits. deliberately not
            // Israeli-only - registrants from other countries are expected
            return /^\d{7,15}$/.test(val.replace(/^(\+|00)/, "").replace(/[\s\-()]/g, ""))
                   ? "" : "מספר טלפון לא תקין";
        case 7:
            return /^[A-Za-z0-9 '\.\-]+$/.test(val) ? "" : "אותיות באנגלית בלבד";
        case 8:
            return /^([01]\d|2[0-3]):[0-5]\d$/.test(val) ? "" : "שעה לא תקינה";
        default:
            return "";
    }
}

function validIsraeliId(id) {
    id = String(id).replace(/[\s\-]/g, "");
    if (!/^\d{1,9}$/.test(id)) return false;
    while (id.length < 9) id = "0" + id;
    var sum = 0;
    for (var i = 0; i < 9; i++) {
        var d = Number(id.charAt(i)) * ((i % 2) + 1);
        if (d > 9) d -= 9;
        sum += d;
    }
    return (sum % 10) === 0;
}

function changeColors() {
    if (!x) return;

    document.body.style.backgroundColor = x.bkcolor;
    document.body.style.color = x.textcolor;

    var forumEl = document.querySelector(".forumDetails");
    if (forumEl) forumEl.style.color = x.textColor2;

    var buttonEl = document.querySelector(".sendButton");
    if (buttonEl) buttonEl.style.backgroundColor = x.bkButton;

    if (x.roundedCorners == "True") {
        document.querySelectorAll(".formArea .title").forEach(function (el) {
            el.style.borderTopRightRadius = "10px";
            el.style.borderTopLeftRadius = "10px";
        });
    }
}
